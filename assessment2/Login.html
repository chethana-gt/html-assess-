<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar{
            height: 70px;
            width: 100%;
            background: linear-gradient(to right, #cc5333, #23074d);
            display: flex;
        }

        .logo{
            height: 70px;
            flex-basis: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img{
            height: 60px;
            width: 60px;
            border-radius: 50%;
        }

        .menu{
            height: 70px;
            flex-basis: 75%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .menu a{
            color: aliceblue;
            font-size: larger;
            text-decoration: none;
        }

        .menu a:hover{
            border-bottom: 1px solid aliceblue;
            color: goldenrod;
        }

        .icons{
            height: 70px;
            flex-basis: 15%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: xx-large;
            color: aliceblue;
        }

        .login{
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .login h1{
            text-align: center;
            margin-bottom: 25px;
        }

        .login input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
        }

        .login button{
            width: 100%;
            padding: 12px;
            background: #23074d;
            color: white;
            border: none;
            cursor: pointer;
        }

        .login p{
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <aside class="logo">
            <img src="./BestFriends.png" alt="">
        </aside>

        <aside class="menu">
            <a href="home.html">Home Page</a>
            <a href="users.html">Users</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </aside>

        <aside class="icons">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-twitter"></i>
        </aside>
    </nav>

    <div class="login">
        <h1>Login</h1>

        <form>
            <input type="email" placeholder="Enter Email">
            <input type="password" placeholder="Enter Password">
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="register.html">Register</a></p>
    </div>

</body>
</html>
