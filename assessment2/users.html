<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            height: 70px;
            width: 100%;
            background: linear-gradient(to right, #cc5333, #23074d);
            display: flex;
        }

        .logo {
            height: 70px;
            flex-basis: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            height: 60px;
            width: 60px;
            border-radius: 50%;
        }

        .menu {
            height: 70px;
            flex-basis: 75%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .menu a {
            color: aliceblue;
            font-size: larger;
            text-decoration: none;
        }

        .menu a:hover {
            border-bottom: 1px solid aliceblue;
            color: goldenrod;
        }

        .icons {
            height: 70px;
            flex-basis: 15%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: xx-large;
            color: aliceblue;
        }

        .users {
            padding: 50px;
            text-align: center;
        }

        .users h1 {
            font-size: 35px;
            margin-bottom: 40px;
        }

        .user-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .user-card {
            width: 220px;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 2px 8px gray;
        }

        .user-card img {
            height: 120px;
            width: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .user-card h3 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .user-card p {
            color: gray;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <aside class="logo">
            <img src="./BestFriends.png" alt="Logo">
        </aside>

        <aside class="menu">
            <a href="home.html">Home Page</a>
            <a href="users.html">Users</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </aside>

        <aside class="icons">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-twitter"></i>
        </aside>
    </nav>

    <section class="users">
        <h1>Users</h1>

        <div class="user-container">

            <div class="user-card">
                <img src="./BestFriends.png" alt="User 1">
                <h3>Gagana</h3>
                <p>gagana@gmail.com</p>
            </div>

            <div class="user-card">
                <img src="./BestFriends.png" alt="User 2">
                <h3>Chethana</h3>
                <p>chethana@gmail.com</p>
            </div>

            <div class="user-card">
                <img src="./BestFriends.png" alt="User 3">
                <h3>Nirma</h3>
                <p>nirma@gmail.com</p>
            </div>

            <div class="user-card">
                <img src="./BestFriends.png" alt="User 4">
                <h3>Aishu</h3>
                <p>aishu@gmail.com</p>
            </div>

        </div>
    </section>

</body>
</html>
